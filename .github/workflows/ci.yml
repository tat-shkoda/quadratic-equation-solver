name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose run --rm --no-deps php composer install
      - run: docker compose up --exit-code-from php --abort-on-container-exit
      - run: docker compose down
        if: always()
